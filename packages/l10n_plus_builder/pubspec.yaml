name: l10n_plus_builder
description: build_runner adapter for the l10n_plus code generator, for projects that already use build_runner.
version: 0.1.0
repository: https://github.com/Zalexei/l10n_plus/tree/main/packages/l10n_plus_builder
issue_tracker: https://github.com/Zalexei/l10n_plus/issues
topics:
  - localization
  - i18n
  - l10n
  - codegen
  - build-runner
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  build: '>=2.4.0 <6.0.0'
  glob: ^2.1.0
  l10n_plus_generator: ^0.1.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
