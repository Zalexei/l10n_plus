input_directory: translations
output_directory: lib/l10n
base_locale: en
fallback_locale: en

class_name: Strings
locale_enum_name: StringsLocale

# What a TMS exports: intl_<locale>.arb, keys already fully qualified, so the
# file name must be discarded rather than turned into a namespace.
file_pattern: "intl_*{locale}"

# Spanish came back from the vendor with half the batch.
fill_missing_from_base: true

flutter:
  enabled: false
